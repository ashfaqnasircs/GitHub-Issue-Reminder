name: Daily Reminder

on:
  schedule:
    # 11:55 AM PKT = 06:55 UTC
    - cron: "55 6 * * *"
  workflow_dispatch:   # manual test trigger

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `🔔 Daily Reminder - ${today}`;

            // Your reminder content — edit this!
            const body = [
              '## ⏰ Time to do your daily task!',
              '',
              '**Reminder:** _[Replace this with what you want to be reminded about]_',
              '',
              '---',
              `📅 Date: ${today}`,
              `🕐 Time: ${new Date().toUTCString()}`,
              `🤖 Triggered by: GitHub Actions`
            ].join('\n');

            // Check if today's issue already exists
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'daily-reminder'
            });

            const todaysIssue = existing.data.find(i => i.title === title);

            if (todaysIssue) {
              console.log(`✅ Reminder issue already exists: #${todaysIssue.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['daily-reminder']
              });
              console.log(`🎉 Created reminder issue #${issue.data.number}`);
            }
